<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450"><rect width="100%" height="100%" fill="#fff"/><text x="450" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">C4 Level 4 — Code-Level Overview</text><rect x="300" y="70" width="300" height="70" rx="10" fill="#d9ead3" stroke="#38761d" stroke-width="2"/><text x="450" y="98" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">main.py — main()</text><text x="450" y="120" text-anchor="middle" font-family="Arial" font-size="13">run_algorithm() • render_maze()</text><rect x="70" y="210" width="220" height="100" rx="10" fill="#fff2cc" stroke="#bf9000" stroke-width="2"/><text x="180" y="242" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">bfs.py</text><text x="180" y="267" text-anchor="middle" font-family="Arial" font-size="13">bfs()</text><text x="180" y="287" text-anchor="middle" font-family="Arial" font-size="13">get_neighbors()</text><rect x="340" y="210" width="220" height="100" rx="10" fill="#f4cccc" stroke="#990000" stroke-width="2"/><text x="450" y="242" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">dfs.py</text><text x="450" y="267" text-anchor="middle" font-family="Arial" font-size="13">dfs(depth_limit=200)</text><text x="450" y="287" text-anchor="middle" font-family="Arial" font-size="13">Uses shared helpers</text><rect x="610" y="210" width="220" height="100" rx="10" fill="#e8f1fb" stroke="#3267a8" stroke-width="2"/><text x="720" y="242" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold">Path utilities</text><text x="720" y="267" text-anchor="middle" font-family="Arial" font-size="13">validate_maze()</text><text x="720" y="287" text-anchor="middle" font-family="Arial" font-size="13">reconstruct_path()</text><path d="M450 140 V175 H180 V210 M450 175 V210 M450 175 H720 V210 M290 260 H340 M560 260 H610" stroke="#333" stroke-width="2" fill="none"/><path d="M171 201 L180 210 L189 201 M441 201 L450 210 L459 201 M711 201 L720 210 L729 201" stroke="#333" stroke-width="2" fill="none"/><text x="450" y="370" text-anchor="middle" font-family="Arial" font-size="14">run_algorithm() measures perf_counter time, expanded nodes, and path length.</text><text x="450" y="395" text-anchor="middle" font-family="Arial" font-size="14">bfs() returns the shortest path for equal-cost moves; dfs() is depth-limited.</text></svg>